<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    <title>Recursos | Lina Rodríguez Marketing</title>

    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #222;
        background: #fafafa;
      }

      body {
        max-width: 800px;
        margin: 0 auto;
        padding: 64px 24px;
      }

      h1 {
        margin-bottom: 8px;
      }

      ul {
        display: grid;
        gap: 16px;
        padding: 0;
        margin-top: 40px;
        list-style: none;
      }

      a {
        display: block;
        padding: 20px;
        color: inherit;
        font-size: 1.125rem;
        font-weight: 600;
        text-decoration: none;
        background: white;
        border: 1px solid #ddd;
        border-radius: 12px;
        transition:
          border-color 150ms ease,
          transform 150ms ease;
      }

      a:hover {
        border-color: #0084d1;
        transform: translateY(-2px);
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Recursos</h1>
      <p>Herramientas y recursos de marketing para tu negocio.</p>

      <ul>
        <li>No hay recursos publicados todavía.</li>
      </ul>
    </main>
  </body>
</html>
